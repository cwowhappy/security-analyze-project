version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: security-analyze-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: security_analyze
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d security_analyze"]
      interval: 10s
      timeout: 5s
      retries: 5
