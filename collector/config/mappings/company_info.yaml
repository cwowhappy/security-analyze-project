task_type: company_info
ttl_hours: 168

sources:
  - name: akshare
    adapter: company_info_akshare_adapter
    priority: 1
    field_mapping:
      - api_field: "公司名称"
        db_field: "name"
        converter: "str"
        null_policy: "fail"
      - api_field: "A股简称"
        db_field: "short_name"
        converter: "str"
        null_policy: "skip"
      - api_field: "英文名称"
        db_field: "english_name"
        converter: "str"
        null_policy: "skip"
      - api_field: "曾用简称"
        db_field: "former_name"
        converter: "str"
        null_policy: "skip"
      - api_field: "法人代表"
        db_field: "legal_representative"
        converter: "str"
        null_policy: "skip"
      - api_field: "注册资金"
        db_field: "reg_capital"
        converter: "capital"
        null_policy: "skip"
      - api_field: "成立日期"
        db_field: "setup_date"
        converter: "date_hyphen"
        null_policy: "skip"
      - api_field: "注册地址"
        db_field: "reg_address"
        converter: "str"
        null_policy: "skip"
      - api_field: "办公地址"
        db_field: "office_address"
        converter: "str"
        null_policy: "skip"
      - api_field: "官方网站"
        db_field: "website"
        converter: "str"
        null_policy: "skip"
      - api_field: "所属行业"
        db_field: "industry"
        converter: "str"
        null_policy: "skip"
      - api_field: "主营业务"
        db_field: "main_business"
        converter: "str"
        null_policy: "skip"
      - api_field: "经营范围"
        db_field: "business_scope"
        converter: "str"
        null_policy: "skip"
      - api_field: "机构简介"
        db_field: "introduction"
        converter: "str"
        null_policy: "skip"

  - name: tushare
    adapter: company_info_tushare_adapter
    priority: 2
    field_mapping:
      - { api_field: "chairman", db_field: "chairman", converter: "str", null_policy: "skip" }
      - { api_field: "manager", db_field: "manager", converter: "str", null_policy: "skip" }
      - { api_field: "secretary", db_field: "secretary", converter: "str", null_policy: "skip" }
      - { api_field: "employees", db_field: "employees", converter: "int", null_policy: "skip" }
