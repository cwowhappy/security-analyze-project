task_type: financial_income
ttl_hours: 168

sources:
  - name: akshare
    adapter: financial_sina_adapter
    priority: 1
    field_mapping:
      - api_field: ["报告日", "报告期", "报告日期"]
        db_field: "report_date"
        converter: "date_hyphen"
        null_policy: "fail"
      - api_field: ["基本每股收益", "每股收益"]
        db_field: "basic_eps"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["稀释每股收益"]
        db_field: "diluted_eps"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["营业总收入", "营业收入"]
        db_field: "total_revenue"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["营业收入"]
        db_field: "revenue"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["营业成本", "营业总成本"]
        db_field: "operating_cost"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["销售费用"]
        db_field: "selling_expense"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["管理费用"]
        db_field: "admin_expense"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["研发费用"]
        db_field: "rd_expense"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["财务费用"]
        db_field: "financial_expense"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["营业利润"]
        db_field: "operating_profit"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["利润总额"]
        db_field: "total_profit"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["净利润"]
        db_field: "net_profit"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["归属于母公司股东的净利润", "归母净利润"]
        db_field: "np_parent_company"
        converter: "decimal"
        null_policy: "skip"
      - api_field: ["扣除非经常性损益后的净利润"]
        db_field: "np_excl_nonrecurring"
        converter: "decimal"
        null_policy: "skip"
    params:
      symbol: "利润表"
