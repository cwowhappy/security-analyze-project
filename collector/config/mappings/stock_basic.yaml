task_type: stock_basic
ttl_hours: 24

sources:
  - name: akshare
    adapter: stock_basic_akshare_adapter
    priority: 1
    field_mapping:
      - api_field: "代码"
        db_field: "stock_code"
        converter: "str"
        null_policy: "fail"
      - api_field: "名称"
        db_field: "name"
        converter: "str"
        null_policy: "fail"
      - api_field: ["总市值", "total_market_cap"]
        db_field: "total_market_cap"
        converter: "float"
        null_policy: "skip"
    params:
      api_name: "stock_info_a_code_name"

  - name: tushare
    adapter: stock_basic_tushare_adapter
    priority: 2
    field_mapping:
      - api_field: "ts_code"
        db_field: "ts_code"
        converter: "str"
        null_policy: "skip"
      - api_field: "industry"
        db_field: "industry"
        converter: "str"
        null_policy: "default"
        default_value: ""
