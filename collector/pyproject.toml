[project]
name = "collector"
version = "0.1.0"
description = "股票分析系统数据采集模块"
authors = [
    {name = "Stock Analyze Team"}
]
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary] (>=3.2.0)",
    "akshare (>=1.15.0)",
    "schedule (>=1.2.0)",
    "python-dotenv (>=1.0.0)",
    "pydantic (>=2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
