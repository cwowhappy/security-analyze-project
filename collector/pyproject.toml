[project]
name = "data-collector"
version = "0.1.0"
description = "股票数据采集模块"
authors = [
    {name = "Security Analyze Team"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "requests>=2.33.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "structlog>=25.0.0",
    "akshare>=1.18.0",
    "tushare>=1.4.0",
    "psycopg2-binary>=2.9.0",
    "python-ulid>=3.0.0",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
ruff = "^0.11.0"

[project.scripts]
data-collector = "data_collector.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ANN", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["data_collector"]
