server:
  port: 8080

spring:
  application:
    name: security-analyze-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db-security-analyze}
    username: ${DB_USER:user-security-analyze}
    password: ${DB_PASSWORD:SecurityAnalyze@2026}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:security-analyze-default-secret-key-change-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

mail:
  enabled: ${MAIL_ENABLED:false}
  host: ${MAIL_HOST:smtp.example.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  from: ${MAIL_FROM:noreply@example.com}

logging:
  level:
    org.cwowhappy.securityanalyze: DEBUG
    org.springframework.jdbc: DEBUG
