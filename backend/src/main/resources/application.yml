server:
  port: 8080
  tomcat:
    relaxed-query-chars: '[,],|,{,},^,`,",<,>,\,'

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  allowed-methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed-headers:
    - "*"
  allow-credentials: true
  exposed-headers:
    - "Authorization"
  path-pattern: "/**"

spring:
  application:
    name: security-analyze
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db-security-analyze}
    username: ${DB_USER:user_security_analyze}
    password: ${DB_PASSWORD:Admin@2026#}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: false
  sql:
    init:
      mode: never

logging:
  file:
    name: logs/security-analyze
  level:
    com.example.securityanalyze: DEBUG
